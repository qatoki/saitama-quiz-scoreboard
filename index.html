.bx{--c:var(--box)}.win .bx{--c:var(--boxw)}.out .bx,.lose .bx{--c:#333}.out .bx>.f,.lose .bx>.f{color:#999}
.pc{position:relative}
.nmb{flex:1;min-height:0}.nmb>.f{overflow:hidden}

/* 側面の得点バー（quiz-app と同じ） */
.tr{position:absolute;top:2.1em;bottom:1.3em;width:.27em;background:rgba(255,255,255,.12);transform:translateZ(calc(var(--d)/2))}.tr.l{left:-.3em}.tr.r{right:-.3em}
.sb{position:absolute;bottom:0;left:0;right:0;height:0;background:#ffc27a;transition:height .7s linear}
.pc.win .tr{opacity:0;transition:opacity .3s .55s}.pc.out .tr,.pc.lose .tr{opacity:0}
/* キャップ（上下とも灰色） */

.led{position:absolute;left:100%;top:50%;font-family:"Agency FB",var(--num);font-size:1.6em;font-weight:700;white-space:nowrap;letter-spacing:.02em;line-height:1;animation:tick var(--tt,1.4s) linear forwards}

.led.o.d{color:#ff9a1f;text-shadow:0 0 .25em #ff7a00,0 0 .5em rgba(255,122,0,.6)}
.led.x{color:#ff3b4a;text-shadow:0 0 .25em #ff2030,0 0 .5em rgba(255,32,48,.6)}
@keyframes tick{from{transform:translate(0,-50%)}to{transform:translate(calc(-100% - var(--cw,6em)),-50%)}}
.cap.b{bottom:-.2em;height:1.5em}.cap.b>.f{font-family:var(--num);font-size:1.1em;font-weight:700;color:#ffd91a;letter-spacing:.06em;white-space:nowrap;gap:.2em}
.cap.b.dg>.f{color:#ff5a62}
.wn{display:inline-block;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:1.05em;animation:wn 1.5s ease-in-out infinite alternate}

.ptb{height:1.3em;flex:none;font-size:3.2em;font-family:var(--num);font-weight:700}

.win .pv{-webkit-text-stroke-color:var(--olw)}
.pc.ren .ptb .pv{animation:rf .9s ease-in-out infinite alternate}@keyframes rf{from{color:#fff}to{color:#ff9a1f}} /* 連答中：色の点滅のみ（光のぼかしなし） */
.xs{text-align:center;font-size:1.9em;line-height:1;white-space:nowrap;height:1em}
.xm{display:inline-block;width:.9em;text-align:center;font-weight:900;color:#444}.xm.x{color:#ff3b3b}.xm.pop{animation:xp .6s ease-out}
@keyframes xp{from{transform:scale(3.2);opacity:0}}
/* 失格リーチ：最後の中黒が燃える */
.xm.fire{position:relative;color:#fff1b0;text-shadow:0 0 .12em #ffcc33,0 0 .3em #ff7a00;animation:fglow .22s ease-in-out infinite alternate}
.xm.fire::before,.xm.fire::after{content:'';position:absolute;left:50%;pointer-events:none;border-radius:50% 0 50% 50%;transform-origin:50% 50%}
.xm.fire::before{bottom:.3em;width:.78em;height:.78em;margin-left:-.39em;background:radial-gradient(circle at 62% 38%,#fff6c8 0 14%,#ffc23a 38%,#ff5a00 70%,rgba(255,40,0,0) 100%);animation:flame .3s ease-in-out infinite alternate;filter:drop-shadow(0 0 .08em #ff6a00)}
.xm.fire::after{bottom:.36em;width:.4em;height:.4em;margin-left:-.2em;background:radial-gradient(circle at 60% 40%,#fff 0 20%,#ffe066 60%,rgba(255,200,0,0) 100%);animation:flame2 .24s ease-in-out infinite alternate}
@keyframes flame{0%{transform:rotate(-45deg) scale(1);opacity:.95}50%{transform:rotate(-40deg) scale(1.12,1.22) translate(.02em,-.02em)}100%{transform:rotate(-50deg) scale(.94,1.08);opacity:.85}}
@keyframes flame2{from{transform:rotate(-45deg) scale(.9)}to{transform:rotate(-38deg) scale(1.15)}}
@keyframes fglow{from{text-shadow:0 0 .12em #ffcc33,0 0 .3em #ff7a00}to{text-shadow:0 0 .2em #ffdd55,0 0 .5em #ff4a00}}
.xt{font-family:var(--num);font-weight:700;font-size:.8em;color:#ff7a7a}
.pc.dim{opacity:.35}
/* 列の演出 */
.pc.a-up .ptb{animation:sp1 .5s ease-in-out}

.pc.a-win .nmb>.f::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);background-size:300% 100%;opacity:0;pointer-events:none;animation:shine 1.4s .9s ease-out both}
.pc.a-out .nmb,.pc.a-out .ptb{animation:sp1 .5s ease-in-out}
.pc.a-dmg .ptb{animation:dmg .5s ease-out}
/* QF-1：正解が出たら他の全員に「HIT」→ 得点ボックスが回って数字が変わる（誤答は回転のみ） */
.hit{position:absolute;left:50%;top:46%;z-index:3;font-family:"Agency FB",var(--num);font-weight:700;font-size:2.9em;line-height:1;color:#ff2d3d;padding:.04em .18em;border:.09em solid #ff2d3d;border-radius:.08em;background:rgba(25,0,4,.9);text-shadow:0 0 .2em #ff0018;box-shadow:0 0 .35em rgba(255,0,24,.6);transform:translate(-50%,-50%) rotate(-22deg);opacity:0;animation:hitst .62s ease-out forwards;white-space:nowrap}
@keyframes hitst{0%{opacity:0;transform:translate(-50%,-50%) rotate(-22deg) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-22deg) scale(.92)}28%{transform:translate(-50%,-50%) rotate(-22deg) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-22deg) scale(1.08)}}
.pc.a-hit .ptb{animation:spA .14s .6s ease-in forwards}.pc.a-rot .ptb{animation:spA .14s ease-in forwards}
.pc.a-sw .ptb{animation:spB .38s ease-out}
@keyframes spA{to{transform:rotateY(90deg)}}@keyframes spB{from{transform:rotateY(90deg)}to{transform:rotateY(360deg)}}
@keyframes sp1{to{transform:rotateY(360deg)}}@keyframes sp2{to{transform:rotateY(720deg)}}
@keyframes dmg{0%{transform:translateX(0);filter:brightness(2.4) hue-rotate(-40deg)}20%{transform:translateX(-.15em)}40%{transform:translateX(.15em)}60%{transform:translateX(-.08em)}100%{transform:none;filter:none}}
@keyframes shine{0%{background-position:120% 0;opacity:1}75%{opacity:1}100%{background-position:-60% 0;opacity:0}} /* 光が通り過ぎたら自然に消える */
/* タイトル画面 */
.tv{position:absolute;inset:0;display:flex;align-items:center;padding-left:7em}
.tvin{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:.5em;animation:vin 1s ease-out}
.tk{font-family:var(--jp);font-weight:900;font-size:2.6em;letter-spacing:.3em;color:var(--acc2)}
.tn{font-family:var(--jp);font-weight:900;font-size:8.6em;line-height:1.05;letter-spacing:.02em;background:var(--gr);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gsh 4s linear infinite;filter:drop-shadow(0 0 .12em rgba(0,0,0,.6))}

.tbar{position:absolute;right:-8%;top:-10%;bottom:-10%;width:38%;background:linear-gradient(160deg,var(--box),var(--line));transform:skewX(-14deg);opacity:.75}
.tbar2{position:absolute;right:28%;top:-10%;bottom:-10%;width:1.2%;background:var(--acc);transform:skewX(-14deg);opacity:.8}
.star{position:absolute;z-index:2;fill:var(--acc);animation:tw 2.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35;transform:scale(.7) rotate(0)}to{opacity:1;transform:scale(1.1) rotate(45deg)}}
.tmb{position:absolute;right:7%;top:50%;transform:translateY(-50%);z-index:2;font-family:var(--jp);font-weight:900;font-size:13em;line-height:1;writing-mode:vertical-rl;color:rgba(255,255,255,.12);letter-spacing:.05em}

.cols.fcols .pc{--d:1.8cqw;--dc:2.4cqw}

.out .rise,.lose .rise{filter:grayscale(1);opacity:.4}
.ftk{position:absolute;top:2.1em;bottom:0;width:.75em;pointer-events:none}.ftk.l{left:0}.ftk.r{right:0}

.fnc{position:absolute;left:.9em;right:.9em;top:2.5em;bottom:.6em;display:flex;align-items:center;justify-content:center}.fnc .fnw{font-size:3.6em;-webkit-text-stroke:.1em var(--ol)}.win .fnc .fnw{-webkit-text-stroke-color:var(--olw)}.out .fnc .fnw,.lose .fnc .fnw{color:#999;-webkit-text-stroke-color:#111}

.ftph{flex:none;width:24cqw;height:30cqw;max-height:100%;background:#15151d center/cover no-repeat;border:.25em solid #e8c76a;box-shadow:0 0 2em rgba(255,215,110,.45)}

.swfx i{position:absolute;top:-30%;bottom:-30%;left:-25%;width:150%;transform:translateX(130%) skewX(-18deg)}
.swfx .s1{background:var(--s3);animation:swin .5s cubic-bezier(.7,0,.3,1) forwards,swout .5s cubic-bezier(.7,0,.3,1) 2.55s forwards}
.swfx .s2{background:var(--s2);animation:swin .5s cubic-bezier(.7,0,.3,1) .09s forwards,swout .5s cubic-bezier(.7,0,.3,1) 2.47s forwards}
.swfx .s3{background:var(--s1);animation:swin .5s cubic-bezier(.7,0,.3,1) .18s forwards,swout .5s cubic-bezier(.7,0,.3,1) 2.4s forwards}
@keyframes swin{to{transform:translateX(0) skewX(-18deg)}}
@keyframes swout{from{transform:translateX(0) skewX(-18deg)}to{transform:translateX(-140%) skewX(-18deg)}}
.swt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;z-index:3;animation:swtin .55s cubic-bezier(.2,.9,.3,1.2) .55s backwards,swtout .35s ease-in 2.25s forwards}
@keyframes swtin{from{opacity:0;transform:scale(1.8);filter:blur(.4em)}}
@keyframes swtout{to{opacity:0;transform:scale(.85) translateX(-10%)}}
.swt small{font-family:var(--jp);font-weight:900;font-size:2.4em;letter-spacing:.4em;color:#fff}
.swt b{font-family:var(--jp);font-weight:900;font-size:9em;line-height:1.05;background:var(--tx);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gsh 1.6s linear infinite;filter:drop-shadow(0 .05em .1em rgba(0,0,0,.55))}
.swt em{font-style:normal;font-family:var(--num);font-weight:700;font-size:2em;letter-spacing:.6em;color:#fff}
.swl{position:absolute;left:0;right:0;top:50%;height:.25em;background:#fff;z-index:2;transform:scaleX(0);animation:swl .7s ease-out .5s forwards,swtout .3s 2.2s forwards}
@keyframes swl{0%{transform:scaleX(0);opacity:1}100%{transform:scaleX(1);opacity:0}}
.swfx svg{position:absolute;z-index:3;fill:#fff;animation:swst .9s ease-out backwards,swtout .3s 2.2s forwards}
@keyframes swst{from{transform:scale(0) rotate(-180deg);opacity:0}}

<script>
/* ============================================================
 * 基本設定
 * ============================================================ */
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORD=n=>{const v=n%100;return n+((v>10&&v<14)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th'))};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const FACES='<div class="fl"></div><div class="fr"></div><div class="fk"></div>';
const STAR=(x,y,s,d)=>`<svg class="star" viewBox="0 0 24 24" style="left:${x}%;top:${y}%;width:${s}em;height:${s}em;animation-delay:${d||0}s"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>`;

const MODES={
 shinjin:{jp:'新人王',full:'新人王決定戦',en:'ROOKIE CHAMPIONSHIP'},
 saikyo:{jp:'最強位',full:'最強位決定戦',en:'GRAND CHAMPIONSHIP'}};
const EVENT={date:'2026.12.19 SAT',place:'彩の国すこやかプラザ',tag:'#saitama1quiz'};
/* 各ラウンドのルール（企画書 2026/10/29 版） */
const RULE={
 pre:{nm:'5o2x',win:5,xl:2,N:6,lim:40},            // 予選：5問正解で勝抜、2問誤答で失格、上位6名勝利
 q1:{nm:'Attack Survival 20',N:2,lim:40},           // QF-1：正解で他者LP-1、誤答で自分LP-2、残り2名
 q2:{nm:'連答付き5o2x',win:5,xl:2,N:4,lim:40},     // QF-2：連答状態での正解は+2
 sf:{nm:'7o3x',win:7,xl:3,N:3,lim:50},             // SF：勝抜発生時に下位1名を足切り
 f:{nm:'10o4x',win:10,xl:4,N:1,lim:150}};
const ROUNDS=[
 {k:'p1',type:'pre',lab:'予選 第1セット',g:['第1組','第2組','第3組','第4組']},
 {k:'p2',type:'pre',lab:'予選 第2セット',g:['大部屋 前半組','大部屋 後半組','小部屋 前半組','小部屋 後半組']},
 {k:'p3',type:'pre',lab:'予選 第3セット',g:['大部屋 1組','大部屋 2組','小部屋 1組','小部屋 2組']},
 {k:'q1',type:'q1',lab:'QF-1',g:['1組','2組']},
 {k:'q2',type:'q2',lab:'QF-2',g:['1組','2組']},
 {k:'sf',type:'sf',lab:'SF',g:['1組','2組']},
 {k:'f',type:'f',lab:'Final',g:['']}];
const RULE_KEYS=[['pre','予選（5o2x）'],['q1','QF-1（Attack Survival 20）'],['q2','QF-2（連答付き5o2x）'],['sf','SF（7o3x）'],['f','Final（10o4x）']];
const RULE_TEXT={
 pre:`早押しクイズ。解答権は最初にボタンを押した1名のみ
5問正解で勝ち抜け、2問誤答で失格
各組 上位6名が勝利（限定40問）
限定問題終了時は、正解数 → 誤答数の少なさ で順位を決定
予選は全3セット。勝利数で進出先が決まります（3勝 → SF／2勝 → QF-2／1勝・0勝 → QF-1）`,
 q1:`予選1勝の方は LP20、0勝の方は LP15 からスタート
正解すると、自分以外の全員の LP が 1 減少
誤答すると、自分の LP が 2 減少
LP が 0 になると失格。最後に残った2名が勝ち抜け（限定40問）`,
 q2:`正解で +1 ポイント。正解すると「連答」状態になります
連答状態でもう一度正解すると +2 ポイント
連答は、他の人の正解・自分の誤答・連答状態での自分の正解で解除
5ポイントで勝ち抜け、2問誤答で失格。各組4名が SF へ（限定40問）`,
 sf:`7問正解で勝ち抜け、3問誤答で失格
勝ち抜け者が出るたびに、その時点の最下位1名を足切り
直前の勝ち抜けから失格者が出ていた場合、足切りは行わない
各組3名が決勝へ（限定50問）`,
 f:`10問正解で優勝、4問誤答で失格
限定150問`};
const ruleOf=(dd,t)=>(dd.rules&&dd.rules[t]!=null?dd.rules[t]:RULE_TEXT[t]).split(/\r?\n/).map(x=>x.replace(/^[\s・\-*●]+/,'').trim()).filter(Boolean);
const RD=key=>ROUNDS.find(r=>r.k===key.split('-')[0]);
const gIdx=key=>+key.split('-')[1];
const gLabel=key=>{const r=RD(key);return(r.lab+' '+(r.g[gIdx(key)-1]||'')).trim()};

/* ============================================================
 * データ（S）…2大会ぶんを別々に保持
 * ============================================================ */
const DDEF=()=>({players:[],qs:[],qi:0,showQA:true,view:'title',cur:'p1-1',games:{},plan:{},res:{},sfPick:{},sfPri:null});
const SDEF=()=>({mode:'shinjin',open:true,rev:0,T:{shinjin:DDEF(),saikyo:DDEF()}});
const LSK='saitamaQuizS';
let S=null;try{S=JSON.parse(localStorage[LSK]||'null')}catch(x){}
if(!S||!S.T)S=SDEF();
for(const m in MODES)S.T[m]=Object.assign(DDEF(),S.T[m]||{});
const CFGDEF=()=>({fb:'',room:'saitama2026',auto:false,hook:'',hookAuto:false,appUrl:''});
S.cfg=Object.assign(CFGDEF(),S.cfg||{});
if(S.open===undefined)S.open=true;
/* 問題（パスワード保護時は暗号文だけを保存し、復号した問題はメモリ上にだけ持つ） */
let QS={},KEY={};
const isLocked=m=>!!S.T[m].qsEnc&&!KEY[m];
const qsOf=m=>S.T[m].qsEnc?(QS[m]||[]):(S.T[m].qs||[]);
const D=()=>S.T[S.mode];
const pOf=(dd,id)=>dd.players.find(p=>p.id==id);
const IS_PROJ=location.hash==='#proj';
let proj=null,bc=null;try{bc=new BroadcastChannel('saitamaQuiz')}catch(x){}

function dispName(sei,mei){sei=String(sei||'').trim();mei=String(mei||'').trim();if(!mei)return sei;const n=[...(sei+mei)].length;return n<=3?sei+'　'.repeat(4-n)+mei:sei+mei}
/* ============================================================
 * 端末（操作者）情報：この端末だけに保存（同期しない）
 * ============================================================ */
let DEV={};try{DEV=JSON.parse(localStorage.saitamaDev||'{}')||{}}catch(x){}
function setTheme(m){document.body.classList.remove('t-shinjin','t-saikyo');document.body.classList.add('t-'+m)}
function applyDev(){document.body.classList.toggle('mobile',DEV.type==='sp');const c=$('#devchip');if(c)c.textContent=DEV.name?`${DEV.type==='sp'?'📱':'💻'} ${DEV.name}`:'端末未設定'}
function openDev(){
 if(IS_PROJ||$('#devModal'))return;
 const sp=DEV.type?DEV.type==='sp':matchMedia('(max-width:700px)').matches;
 const d=document.createElement('div');d.id='devModal';
 d.innerHTML=`<div class="dvbox"><h3>この端末の設定</h3><div class="small">操作を始める前に入力してください。試合を開始すると、「ラウンド・組の選択」にこの名前が表示されます。（この端末にだけ保存されます）</div>
  <label class="dvl">端末名（操作者名）<input type="text" id="dvName" value="${e(DEV.name||'')}" placeholder="例：大部屋PC／田中" maxlength="16"></label>
  <div class="dvl">端末種類<div class="dvt"><label><input type="radio" name="dvType" value="pc" ${sp?'':'checked'}> 💻 PC</label><label><input type="radio" name="dvType" value="sp" ${sp?'checked':''}> 📱 スマホ</label></div></div>
  <div class="dvl">役割（起動時に開く画面）<div class="dvt">${[['op','操作'],['rc','受付'],['mc','司会者'],['host','ホスト']].map(([v,l])=>`<label><input type="radio" name="dvRole" value="${v}" ${(DEV.role||'op')===v?'checked':''}> ${l}</label>`).join('')}</div></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px">${DEV.name?'<button onclick="$(\'#devModal\').remove()">キャンセル</button>':''}<button class="pri" onclick="saveDev()">操作を開始</button></div></div>`;
 document.body.appendChild(d);setTimeout(()=>{const i=$('#dvName');i&&i.focus()},50);
}
function saveDev(){const n=$('#dvName').value.trim();if(!n)return alert('端末名（操作者名）を入力してください');
 DEV={name:n,type:(document.querySelector('input[name=dvType]:checked')||{}).value||'pc',role:(document.querySelector('input[name=dvRole]:checked')||{}).value||'op'};try{localStorage.saitamaDev=JSON.stringify(DEV)}catch(x){}
 $('#devModal').remove();applyDev();showTab(DEV.role||'op')}
function save(){persist(true)}
function persist(push){
 S.rev=(S.rev||0)+1;
 try{localStorage[LSK]=JSON.stringify(S)}catch(x){console.warn(x)}
 try{if(proj&&!proj.closed)proj.postMessage({s:S,qs:QS},'*')}catch(x){}
 try{bc&&bc.postMessage({s:S,qs:QS})}catch(x){}
 refreshUI();
 if(push&&!IS_PROJ)pushChanges();
}
function refreshUI(){
 if(IS_PROJ)return;
 $('#modechip').textContent=S.open?'共通オープニング表示中':MODES[S.mode].jp+'決定戦 モード';
 const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&ae.type!=='checkbox'&&ae.closest('.pane');
 const vis=k=>$('#p-'+k).style.display!=='none';
 if(!typing){if(vis('op'))renderOp();else if(vis('rc'))renderRC();else if(vis('mc'))renderMC();else renderHost()}
 syMsg(SY.msg,SY.err);
 drawStage('#pv');
}

/* ============================================================
 * 予選の集計
 * ============================================================ */
function preRank(dd,set,id){for(let g=1;g<=4;g++){const r=dd.res['p'+set+'-'+g];if(r){const i=r.indexOf(id);if(i>=0)return{g,r:i+1}}}return null}
function winsOf(dd,id){let w=0,n=0;for(let s=1;s<=3;s++){const x=preRank(dd,s,id);if(x){n++;if(x.r<=RULE.pre.N)w++}}return{w,n}}
const setDone=(dd,s)=>[1,2,3,4].every(g=>dd.res['p'+s+'-'+g]);
const preDone=dd=>setDone(dd,1)&&setDone(dd,2)&&setDone(dd,3);

/* 第2セット：第1セットの順位から、表の通りに組分け */
function p2Groups(dd){
 const G=[[],[],[],[]];
 for(let g=1;g<=4;g++)dd.res['p1-'+g].forEach((id,i)=>{const r=i+1,big=r<=RULE.pre.N,front=(r%2===1)===(g===1||g===4);G[(big?0:2)+(front?0:1)].push({id,r,g})});
 return G.map(a=>a.sort((x,y)=>x.r-y.r||x.g-y.g).map(x=>x.id));
}
/* 第3セット：第1・第2セットの勝敗で4組 */
function p3Groups(dd){
 const G=[[],[],[],[]];
 dd.players.forEach(p=>{const a=preRank(dd,1,p.id),b=preRank(dd,2,p.id);if(!a||!b)return;
  const w1=a.r<=RULE.pre.N,w2=b.r<=RULE.pre.N;G[w1&&w2?0:!w1&&w2?1:w1&&!w2?2:3].push({id:p.id,g:b.g,r:b.r})});
 return G.map(a=>a.sort((x,y)=>x.g-y.g||x.r-y.r).map(x=>x.id));
}
function planFor(dd,key){
 const k=key.split('-')[0],g=gIdx(key);
 if(dd.plan[key])return{ids:dd.plan[key],man:!['p1','q1','q2'].includes(k)};
 if(k==='p1')return{msg:'まだ組分けしていません。「第1セットを抽選で組分け」を押してください。'};
 if(k==='q1')return{msg:preDone(dd)?'「QF-1を抽選で組分け」を押してください。':'予選3セット（12組）の結果がすべて確定すると抽選できます。'};
 if(k==='q2')return{msg:dd.res['q1-1']&&dd.res['q1-2']?'「QF-2を抽選で組分け」を押してください。':'QF-1（2組）の結果が確定すると抽選できます。'};
 if(k==='p2')return setDone(dd,1)?{ids:p2Groups(dd)[g-1],auto:1}:{msg:'第1セット（4組）の結果がすべて確定すると、企画書の表の通りに自動で組分けされます。'};
 if(k==='p3')return setDone(dd,1)&&setDone(dd,2)?{ids:p3Groups(dd)[g-1],auto:1}:{msg:'第1・第2セットの結果がすべて確定すると自動で組分けされます。'};
 if(k==='sf'){const ids=(dd.sfPri||[]).filter(x=>dd.sfPick[x.id]==g).map(x=>x.id);return ids.length?{ids,auto:1}:{msg:'下の「SFの組選択」で、優先順に各選手の組を選んでください。'}}
 if(k==='f')return dd.res['sf-1']&&dd.res['sf-2']?{ids:[...dd.res['sf-1'].slice(0,3),...dd.res['sf-2'].slice(0,3)],auto:1}:{msg:'SF（2組）の結果が確定すると自動で決まります。'};
 return{msg:''};
}
/* 受付の結果から出場者を決める
   ・定員内で受付済み → 出場
   ・定員内で未受付 → 「繰り上げ」（補欠で受付済みの人と入れ替え）／「不参加」（外す）／「不戦敗」（組には入るが最初から失格）
   ・受付をまったく使っていない場合は、定員内の全員が出場 */
function roster(dd){
 const all=[...dd.players].filter(p=>!p.cxl).sort((a,b)=>a.id-b.id),cap=dd.cap||48,ci=dd.ci||{},ab=dd.ab||{},used=Object.keys(ci).length>0;
 const base=all.slice(0,cap),wait=all.slice(cap).filter(p=>ci[p.id]),ids=[],tag={},pend=[],by={};let wi=0;
 if(!used){base.forEach(p=>{ids.push(p.id);tag[p.id]='ok'});all.slice(cap).forEach(p=>tag[p.id]='wait');return{ids,tag,pend,by,waitLeft:[],used}}
 base.forEach(p=>{
  if(ci[p.id]){ids.push(p.id);tag[p.id]='ok';return}
  const m=ab[p.id];
  if(!m){pend.push(p.id);tag[p.id]='pend';return}
  if(m==='forfeit'){ids.push(p.id);tag[p.id]='ff';return}
  if(m==='up'){if(wi<wait.length){const w=wait[wi++];ids.push(w.id);tag[w.id]='up';by[w.id]=p.id;tag[p.id]='upd';by[p.id]=w.id}else tag[p.id]='upx';return}
  tag[p.id]='skip';
 });
 all.slice(cap).forEach(p=>{if(!tag[p.id])tag[p.id]=ci[p.id]?'wait':'waitno'});
 return{ids,tag,pend,by,waitLeft:wait.slice(wi).map(p=>p.id),used};
}
function rcTag(dd,ro,id){const t=ro.tag[id],c=(dd.ci||{})[id],P=x=>e((pOf(dd,x)||{}).real||'');
 if(!t)return(pOf(dd,id)||{}).cxl?'キャンセル':'';
 return t==='ok'?(c?'✅ 受付済':'出場'):t==='up'?`⬆ 繰り上げ（No.${ro.by[id]}の代わり）`:t==='upd'?`欠席→No.${ro.by[id]}が繰り上げ`:t==='upx'?'欠席（繰り上げ候補なし）':t==='ff'?'不戦敗':t==='skip'?'不参加':t==='pend'?'<b class="warn">未受付（扱い未定）</b>':t==='wait'?'補欠・受付済':'補欠'}
function lotP1(){const dd=D(),ro=roster(dd);if(ro.ids.length<4)return alert('先にホスト画面で参加者を登録してください');
 if(ro.pend.length&&!confirm('受付していない人が'+ro.pend.length+'名いて、扱い（繰り上げ／不参加／不戦敗）が決まっていません。\nこの人たちを除いて組分けしますか？'))return;
 if(Object.keys(dd.games).some(k=>k.startsWith('p1'))&&!confirm('第1セットの試合データがあります。組分けをやり直しますか？'))return;
 const a=shuffle(ro.ids);for(let g=1;g<=4;g++)dd.plan['p1-'+g]=a.filter((_,i)=>i%4===g-1);save()}
function lotQ1(){const dd=D();if(!preDone(dd))return alert('予選の結果がすべて確定していません');
 const one=shuffle(dd.players.filter(p=>winsOf(dd,p.id).w===1).map(p=>p.id)),zero=shuffle(dd.players.filter(p=>winsOf(dd,p.id).w===0).map(p=>p.id));
 [1,2].forEach(g=>dd.plan['q1-'+g]=shuffle([...one.filter((_,i)=>i%2===g-1),...zero.filter((_,i)=>i%2===g-1)]));save()}
function lotQ2(){const dd=D();if(!dd.res['q1-1']||!dd.res['q1-2'])return alert('QF-1の結果が確定していません');
 const two=shuffle(dd.players.filter(p=>winsOf(dd,p.id).w===2).map(p=>p.id)),qw=shuffle([...dd.res['q1-1'].slice(0,2),...dd.res['q1-2'].slice(0,2)]);
 [1,2].forEach(g=>dd.plan['q2-'+g]=shuffle([...two.filter((_,i)=>i%2===g-1),...qw.filter((_,i)=>i%2===g-1)]));save()}
function mkSfPri(){const dd=D();if(!preDone(dd)||!dd.res['q2-1']||!dd.res['q2-2'])return alert('予選・QF-2の結果が確定していません');
 const three=dd.players.filter(p=>winsOf(dd,p.id).w===3).map(p=>({id:p.id,r:preRank(dd,3,p.id).r,lab:'予選3勝（第3セット '+ORD(preRank(dd,3,p.id).r)+'）'})).sort((a,b)=>a.r-b.r);
 const qw=[];[1,2].forEach(g=>dd.res['q2-'+g].slice(0,RULE.q2.N).forEach((id,i)=>qw.push({id,r:i+1,z:Math.random(),lab:'QF-2 '+g+'組 '+ORD(i+1)})));
 qw.sort((a,b)=>a.r-b.r||a.z-b.z);dd.sfPri=[...three,...qw].map(x=>({id:x.id,lab:x.lab}));dd.sfPick={};save()}
function sfPick(id,g){const dd=D();if(dd.sfPick[id]==g)delete dd.sfPick[id];else dd.sfPick[id]=g;save()}

/* ============================================================
 * 試合の進行
 * ============================================================ */
/* 同時進行する2組（ペア）：同じ問題番号から始める */
const PAIRS={'p2-1':'p2-3','p2-3':'p2-1','p2-2':'p2-4','p2-4':'p2-2','p3-1':'p3-3','p3-3':'p3-1','p3-2':'p3-4','p3-4':'p3-2','q1-1':'q1-2','q1-2':'q1-1','q2-1':'q2-2','q2-2':'q2-1'};
const partnerOf=(dd,key)=>{const k=PAIRS[key];return k?{key:k,G:dd.games[k]}:null};
function nextFree(dd){let m=dd.qi||0;for(const k in dd.games){const g=dd.games[k];if(g&&g.qp!=null)m=Math.max(m,g.qp)}return m} // まだ誰も使っていない最初の問題
function startIdx(dd,key){const pt=partnerOf(dd,key);if(pt&&pt.G&&pt.G.qs0!=null)return pt.G.qs0;return nextFree(dd)}
const gQp=(dd,G)=>{if(G.qp==null){G.qs0=dd.qi||0;G.qp=G.qs0}return G.qp};
function newGame(dd,key,ids){
 const r=RD(key),t=r.type,st={};
 const ro=roster(dd),ff=ids.filter(id=>ro.tag[id]==='ff');
 ids.forEach((id,i)=>{const w=winsOf(dd,id);st[id]={pt:0,c:0,x:0,lp:t==='q1'?(w.n===3&&w.w===0?15:20):0,s:ff.includes(id)?'out':'play',ff:ff.includes(id)?1:0,ord:0,seat:i+1}});
 const q0=UI.qst!=null?UI.qst:startIdx(dd,key);UI.qst=null;
 dd.games[key]={key,type:t,ids:[...ids],st,n:0,qs0:q0,qp:q0,t:Date.now(),wins:[],outs:ff.length?[ff]:[],ren:null,outSince:false,pendCut:null,done:false,log:[],hist:[],order:null,fixed:false};
}
const alive=G=>G.ids.filter(id=>G.st[id].s==='play');
const keyOf=(G,id)=>{const p=G.st[id];return G.type==='q1'?[p.lp]:G.type==='q2'||G.type==='f'?[p.pt,-p.x]:[p.c,-p.x]};
const cmpD=G=>(a,b)=>{const x=keyOf(G,a),y=keyOf(G,b);for(let i=0;i<x.length;i++)if(x[i]!==y[i])return y[i]-x[i];return 0};
function pushHist(G,dd){const c={};for(const k in G)if(k!=='hist'&&k!=='log')c[k]=G[k];G.hist.push({g:JSON.parse(JSON.stringify(c)),ll:G.log.length,qi:dd.qi,res:dd.res[G.key]||null});if(G.hist.length>80)G.hist.shift()}
function undo(){const dd=D(),G=dd.games[dd.cur];if(!G||!G.hist.length)return;const h=G.hist.pop();Object.assign(G,h.g);G.log.length=h.ll;dd.qi=h.qi;if(h.res)dd.res[G.key]=h.res;else delete dd.res[G.key];save()}
function settle(G){
 const R=RULE[G.type];if(G.pendCut)return;
 const al=alive(G).sort(cmpD(G)),slots=R.N-G.wins.length;
 if(slots>0&&al.length>0&&al.length<=slots)al.forEach(id=>{G.st[id].s='win';G.wins.push(id);G.st[id].ord=G.wins.length});
 G.done=G.wins.length>=R.N||alive(G).length===0;
}
function sfCut(G){ // SF：勝抜者が出たら下位1名を足切り（直前の勝抜以降に失格者がいれば実行しない）
 if(G.outSince){G.outSince=false;G.log[G.log.length-1].noCut=1;return}
 if(G.wins.length>=RULE.sf.N)return;
 const al=alive(G);if(!al.length)return;
 const s=al.sort(cmpD(G)),low=s[s.length-1],tied=s.filter(id=>cmpD(G)(id,low)===0);
 if(tied.length===1)cutOne(G,low);else G.pendCut=tied;
}
function cutOne(G,id){G.st[id].s='out';G.st[id].cut=1;G.outs.push([id])}
function pickCut(id){const dd=D(),G=dd.games[dd.cur];pushHist(G,dd);cutOne(G,id);G.pendCut=null;settle(G);save()}
function judge(kind,id){
 const dd=D(),G=dd.games[dd.cur];if(!G)return;const R=RULE[G.type];
 if(G.n>=R.lim&&!G.extra&&!confirm('限定問題数（'+R.lim+'問）に達しています。追加問題として続けますか？'))return;
 if(G.n>=R.lim)G.extra=true;
 if(G.po)return alert('プレーオフ中です。プレーオフの○×は該当者の列で押してください。');
 if(G.pendCut)return alert('足切り対象（同点）を先に選んでください。');
 if(G.done&&kind!=='t')return;
 pushHist(G,dd);G.order=null;
 G.log.push({q:gQp(dd,G),k:kind,id:id||null});G.n++;G.qp++;G.t=Date.now();dd.qi=Math.max(dd.qi||0,G.qp);
 const p=id!=null?G.st[id]:null;
 if(kind==='o'){
  p.c++;
  if(G.type==='q1'){const dead=[];alive(G).forEach(o=>{if(o!=id){G.st[o].lp--;if(G.st[o].lp<=0)dead.push(o)}});if(dead.length){dead.forEach(o=>G.st[o].s='out');G.outs.push(dead)}}
  else{let add=1;if(G.type==='q2'){if(G.ren==id){add=2;G.ren=null;G.log[G.log.length-1].dbl=1}else G.ren=id}
   p.pt+=add;
   if(p.pt>=R.win){p.s='win';G.wins.push(id);p.ord=G.wins.length;if(G.ren==id)G.ren=null;if(G.type==='sf')sfCut(G)}}
 }else if(kind==='x'){
  p.x++;if(G.type==='q2'&&G.ren==id)G.ren=null;
  if(G.type==='q1'){p.lp-=2;if(p.lp<=0){p.s='out';G.outs.push([id])}}
  else if(p.x>=R.xl){p.s='out';G.outs.push([id]);G.outSince=true}
 }
 settle(G);save();
}
/* 順位：勝抜順 → 残存者（正解数・誤答数など）→ 失格者（後に失格した人ほど上位）
   同点のまとまりには gid（メンバーのid）を付け、手動で並べ替えて「決定済み」にする */
function compRank(G){
 const L=[],cmp=cmpD(G);
 G.wins.forEach(id=>L.push({id}));
 const grp=(arr,sim)=>{const a=[...arr].sort(cmp);let i=0;while(i<a.length){let j=i;while(j+1<a.length&&cmp(a[j+1],a[i])===0)j++;const m=a.slice(i,j+1),gid=m.length>1?[...m].sort((x,y)=>x-y).join('-'):null;m.forEach(id=>L.push({id,gid,sim:sim&&m.length>1}));i=j+1}};
 grp(G.ids.filter(id=>G.st[id].s==='play'||G.st[id].s==='lose'),false);
 [...G.outs].reverse().forEach(gr=>grp(gr,true));
 return L;
}
const compRankIds=G=>compRank(G).map(x=>x.id);
const rankIds=G=>{const c=compRankIds(G),o=G.order;return o&&o.length===c.length&&G.wins.every((w,i)=>o[i]==w)&&c.every(id=>o.includes(id))?o:c};
function tieGroups(G){const ids=rankIds(G),g={};compRank(G).forEach(x=>{if(x.gid)(g[x.gid]=g[x.gid]||{gid:x.gid,pos:[],sim:x.sim}).pos.push(ids.indexOf(x.id))});return Object.values(g)}
function needAck(G,from,to){return tieGroups(G).filter(t=>t.pos.some(p=>p>=from&&p<to)&&!(G.ack||{})[t.gid])}
function ackTie(gid,v){const dd=D(),G=dd.games[dd.cur];G.ack=G.ack||{};if(v)G.ack[gid]=1;else delete G.ack[gid];save()}
function moveRank(i,d){const dd=D(),G=dd.games[dd.cur];const a=[...rankIds(G)];const j=i+d;const lo=G.wins.length;if(i<lo||j<lo||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];G.order=a;save()}
/* ① 上位N名を一括で勝ち抜け確定（限定問題終了・追加問題後に手動で） */
function fixTop(){
 const dd=D(),G=dd.games[dd.cur],R=RULE[G.type];if(G.done)return;
 if(needAck(G,0,R.N+1).some(t=>t.pos.some(p=>p<R.N)&&t.pos.some(p=>p>=R.N)))return alert('勝ち抜けの境目に同点がいます。プレーオフ・抽選の結果に並べ替えて「決定済み」にチェックしてください。');
 if(G.n<R.lim&&!confirm('まだ限定問題数（'+R.lim+'問）に達していません。現在の順位で上位'+R.N+'名を勝ち抜けにしますか？'))return;
 pushHist(G,dd);const ord=rankIds(G);
 ord.slice(0,R.N).forEach((id,i)=>{const p=G.st[id];if(p.s!=='win'){p.s='win'}p.ord=i+1});
 G.wins=ord.slice(0,R.N);G.order=ord;G.done=true;G.winFixed=true;save();
}
/* ② 下位の順位を確定（これが済むまで次のラウンドを始められない） */
function fixLow(){
 const dd=D(),G=dd.games[dd.cur],R=RULE[G.type];if(!G.done||G.fixed)return;
 const na=needAck(G,R.N,G.ids.length);if(na.length)return alert('下位に同点のまとまりが'+na.length+'組あります。並べ替えて「決定済み」にチェックしてください。');
 pushHist(G,dd);const ord=rankIds(G);dd.res[G.key]=ord;G.fixed=true;G.order=ord;
 ord.forEach((id,i)=>{const p=G.st[id];p.rank=i+1;if(i>=R.N&&p.s!=='out')p.s='lose'});
 save();
 if(S.cfg.hook&&S.cfg.hookAuto)setTimeout(()=>sendDiscord(resultText(dd,G)),TICK+400);
}
const fixRes=()=>{fixTop();fixLow()}; // テスト・一括用

 * 未使用問題：ペアの2組がどちらも終わったとき、読んだ問題が少ない組で

function unusedOf(dd,key){const G=dd.games[key],pt=partnerOf(dd,key);if(!G||!pt||!pt.G||!G.done||!pt.G.done)return null;
 const a=gQp(dd,G),b=gQp(dd,pt.G);return b>a?{from:a,to:b,n:b-a,pk:pt.key}:null}
function startRv(){const dd=D(),G=dd.games[dd.cur],u=unusedOf(dd,dd.cur);if(!G||!u)return;closeNtf();G.rv={from:u.from,to:u.to,i:0};dd.view='game';save()}
function moveRv(d){const dd=D(),G=dd.games[dd.cur];if(!G||!G.rv)return;const n=G.rv.to-G.rv.from;G.rv.i=Math.max(0,Math.min(n-1,G.rv.i+d));save()}

 const was=PDONE[pt.key],now=!!(pt.G&&pt.G.done);PDONE[pt.key]=now;
 if(was===false&&now&&G.done&&!G.rv&&!G.rvDone){const u=unusedOf(dd,k);showNtf(`${gLabel(pt.key)} が終了しました。`,u?`この組で読んでいない問題（もう片方の組だけが読んだ問題）が <b>${u.n}問</b> あります。`:'未使用問題はありません。',!!u)}

/* ============================================================
 * プレーオフ（1○1×）：○で残りの最上位、×で残りの最下位が決まる
 * ============================================================ */
const poDecided=(G,id)=>G.po&&(G.po.top.includes(id)||G.po.bot.includes(id));
const poLeft=G=>G.po.ids.filter(id=>!poDecided(G,id));
function startPO(ids,gid){
 const dd=D(),G=dd.games[dd.cur];if(!G||G.po)return;
 pushHist(G,dd);G.po={ids:ids.map(Number),gid:gid||null,top:[],bot:[],q:0};save();
}
function poApply(G){ // 結果を順位表の並びに反映（該当者がいた位置の中で並べ替え）
 const P=G.po,left=poLeft(G),ord=[...P.top,...left,...P.bot],a=[...rankIds(G)];
 const pos=a.map((id,i)=>P.ids.includes(id)?i:-1).filter(i=>i>=0).sort((x,y)=>x-y);
 if(pos.length===ord.length&&pos.every(i=>i>=G.wins.length)){pos.forEach((p,k)=>a[p]=ord[k]);G.order=a}
 if(left.length<=1&&P.gid){G.ack=G.ack||{};G.ack[P.gid]=1}
}
function judgePO(kind,id){
 const dd=D(),G=dd.games[dd.cur];if(!G||!G.po)return;const P=G.po;
 if(id!=null&&(poDecided(G,id)||!P.ids.includes(id)))return;
 if(poLeft(G).length<=1)return alert('プレーオフは決着しています。「プレーオフ終了」を押してください。');
 pushHist(G,dd);G.log.push({q:gQp(dd,G),k:kind,id:id??null,po:1});G.qp++;dd.qi=Math.max(dd.qi||0,G.qp);P.q++;
 if(kind==='o')P.top.push(id);else if(kind==='x')P.bot.unshift(id);
 poApply(G);save();
}
function endPO(){const dd=D(),G=dd.games[dd.cur];if(!G||!G.po)return;
 if(poLeft(G).length>1&&!confirm('まだ決着していません（残り'+poLeft(G).length+'名）。プレーオフを終了しますか？\n残った人の並びは抽選などで決めて ↑↓ で並べ替えてください。'))return;
 pushHist(G,dd);G.po=null;save()}

function adj(id,f,v){
 const dd=D(),G=dd.games[dd.cur];pushHist(G,dd);const p=G.st[id];
 if(f==='s'){G.wins=G.wins.filter(x=>x!=id);G.outs=G.outs.map(g=>g.filter(x=>x!=id)).filter(g=>g.length);p.s=v;p.cut=0;
  if(v==='win')G.wins.push(id);if(v==='out')G.outs.push([id]);G.wins.forEach((x,i)=>G.st[x].ord=i+1);
  G.done=G.wins.length>=RULE[G.type].N||alive(G).length===0}
 else if(f==='ren'){G.ren=v?id:(G.ren==id?null:G.ren)}
 else p[f]=+v;
 G.order=null;save();
}
function unfixedBefore(dd,key){const ri=ROUNDS.indexOf(RD(key));return Object.keys(dd.games).filter(k=>ROUNDS.indexOf(RD(k))<ri&&!dd.games[k].fixed)}

const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};

async function decQs(key,enc){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(enc.iv)},key,ub64(enc.ct));return JSON.parse(new TextDecoder().decode(pt))}
function cryptoOK(){if(window.crypto&&crypto.subtle)return true;alert('このブラウザでは暗号化機能が使えません（Chrome / Edge の最新版で開いてください）');return false}

}

function parseDelim(t){ // 引用符・改行入りにも対応。区切りは1行目にタブがあればタブ、なければカンマ
 t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0],d=first.includes('\t')?'\t':',',rows=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}
  if(c==='"'&&f===''){q=true;continue}
  if(c===d){row.push(f);f='';continue}
  if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';continue}
  f+=c}

}

/* ============================================================
 * Firebase 同期（組ごとに別文書・リアルタイム）
 *  文書ID：「大会__base」…参加者・問題・組分け
 *          「大会__組キー」…その組の試合データと確定結果
 *  2台で別々の組を操作しても上書きし合いません（同じ組を2台で操作するのは不可）。
 *  「次に読む問題番号」「表示中の画面」「選択中の組」「大会モード」は端末ごと（同期しません）。
 * ============================================================ */
const CID=Math.random().toString(36).slice(2,10);
const SY={on:false,db:null,unsub:null,last:{},timer:null,msg:'',err:false};
const baseOf=dd=>JSON.stringify({cap:dd.cap||48,fees:dd.fees||{},rules:dd.rules||{},players:dd.players,qs:dd.qs,qsEnc:dd.qsEnc||null,plan:dd.plan,sfPick:dd.sfPick,sfPri:dd.sfPri,fPhoto:dd.fPhoto!==false});
const gameOf=(dd,k)=>{const g=dd.games[k];let gc=null;if(g){gc={};for(const f in g)if(f!=='hist')gc[f]=g[f]}return JSON.stringify({g:gc,r:dd.res[k]||null})};
const NULLG=JSON.stringify({g:null,r:null});
function pieces(){
 const out={};
 for(const m in MODES){const dd=S.T[m];out[m+'__base']=baseOf(dd);
  new Set([...Object.keys(dd.games),...Object.keys(dd.res)]).forEach(k=>out[m+'__'+k]=gameOf(dd,k));
  Object.keys(dd.photos||{}).forEach(id=>out[m+'__ph_'+id]=JSON.stringify(dd.photos[id]));
  Object.keys(dd.ci||{}).forEach(id=>out[m+'__ci_'+id]=JSON.stringify(dd.ci[id]));
  Object.keys(dd.ab||{}).forEach(id=>out[m+'__ab_'+id]=JSON.stringify(dd.ab[id]))}
 for(const id in SY.last)if(!(id in out)&&!id.endsWith('__base'))out[id]=/__(ph|ci|ab)_/.test(id)?'null':NULLG; // 消した組・写真
 return out;
}
function syMsg(t,err){SY.msg=t;SY.err=!!err;const c=$('#syncchip');if(c){c.textContent=SY.on?(err?'⚠ 同期エラー':'☁ 同期中'):'同期オフ';c.className=SY.on?(err?'err':'on'):'';c.title=t}const m=$('#syncmsg');if(m)m.textContent=t}
function fbInit(){
 if(SY.db)return SY.db;
 if(typeof firebase==='undefined')throw new Error('Firebaseの読み込みに失敗しました（インターネット接続を確認）');
 let c;try{c=JSON.parse(S.cfg.fb.replace(/^[^{]*/,'').replace(/;?\s*$/,'').replace(/([{,]\s*)(\w+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}'))}catch(x){throw new Error('firebaseConfig の形式が正しくありません')}
 const app=firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(c);
 SY.db=app.firestore?app.firestore():firebase.firestore();return SY.db;
}
const col=()=>fbInit().collection(S.cfg.room||'saitama2026');
function applyRemote(id,json){
 const i=id.indexOf('__');if(i<0)return false;const m=id.slice(0,i),k=id.slice(i+2),dd=S.T[m];if(!dd||json==null)return false;
 SY.last[id]=json;
 const o=JSON.parse(json);
 if(k.startsWith('ci_')||k.startsWith('ab_')){const f=k.slice(0,2),pid=k.slice(3);dd[f]=dd[f]||{};if(o!=null)dd[f][pid]=o;else delete dd[f][pid];return true}
 if(k.startsWith('ph_')){dd.photos=dd.photos||{};if(typeof o==='string')dd.photos[k.slice(3)]=o;else delete dd.photos[k.slice(3)];return true}
 if(k==='base'){const was=JSON.stringify(dd.qsEnc||null);Object.assign(dd,o);if(!dd.qsEnc)delete dd.qsEnc;if(JSON.stringify(dd.qsEnc||null)!==was)setTimeout(()=>reDecrypt(m),0);return true}
 if(o.g)dd.games[k]=Object.assign(o.g,{hist:(dd.games[k]&&dd.games[k].hist)||[]});else delete dd.games[k];
 if(o.r)dd.res[k]=o.r;else delete dd.res[k];
 return true;
}
async function startSync(){
 try{
  stopSync(true);syMsg('接続中…');
  const snap=await col().get();let n=0;
  snap.forEach(d=>{if(applyRemote(d.id,d.data().json))n++});
  SY.on=true;S.cfg.auto=true;
  persist(false);pushChanges(true);
  SY.unsub=col().onSnapshot(sn=>{let ch=false;
   sn.docChanges().forEach(c=>{if(c.type==='removed')return;const v=c.doc.data();if(!v||v.by===CID||SY.last[c.doc.id]===v.json)return;if(applyRemote(c.doc.id,v.json))ch=true});
   if(ch){persist(false);syMsg('☁ 受信 '+new Date().toLocaleTimeString())}
  },err=>syMsg('❌ '+err.message,true));
  syMsg('☁ 同期を開始しました（クラウドから'+n+'件取り込み）'+new Date().toLocaleTimeString());
 }catch(x){SY.on=false;syMsg('❌ '+x.message,true)}
}
function stopSync(keep){if(SY.unsub)SY.unsub();SY.unsub=null;SY.on=false;if(!keep){S.cfg.auto=false;persist(false)}syMsg('同期を停止しました')}
function pushChanges(now){
 if(!SY.on)return;
 clearTimeout(SY.timer);
 SY.timer=setTimeout(()=>{
  const P=pieces(),ws=[];
  for(const id in P)if(SY.last[id]!==P[id]){SY.last[id]=P[id];ws.push(col().doc(id).set({json:P[id],at:Date.now(),by:CID}))}
  if(ws.length)Promise.all(ws).then(()=>syMsg('☁ 送信 '+ws.length+'件 '+new Date().toLocaleTimeString())).catch(x=>syMsg('❌ 送信失敗: '+x.message,true));
 },now?0:250);
}
async function pushAll(){
 if(!confirm('この端末のデータ（2大会分）でクラウドを上書きします。よろしいですか？'))return;
 try{syMsg('送信中…');const P=pieces(),ws=[];for(const id in P){SY.last[id]=P[id];ws.push(col().doc(id).set({json:P[id],at:Date.now(),by:CID}))}
  await Promise.all(ws);syMsg('✅ 全送信しました（'+ws.length+'件）'+new Date().toLocaleTimeString())}catch(x){syMsg('❌ '+x.message,true)}
}
async function pullAll(){
 if(!confirm('クラウドのデータでこの端末のデータ（参加者・問題・組分け・試合・結果）を置き換えます。よろしいですか？'))return;
 try{syMsg('受信中…');const snap=await col().get();if(snap.empty)return syMsg('クラウドにデータがありません');
  for(const m in MODES){const dd=S.T[m];Object.assign(dd,{players:[],qs:[],games:{},plan:{},res:{},sfPick:{},sfPri:null,photos:{},ci:{},ab:{}});delete dd.qsEnc}
  SY.last={};let n=0;snap.forEach(d=>{if(applyRemote(d.id,d.data().json))n++});persist(false);syMsg('✅ 全受信しました（'+n+'件）'+new Date().toLocaleTimeString())}catch(x){syMsg('❌ '+x.message,true)}
}
function saveCfg(){
 const old=S.cfg.fb+'|'+S.cfg.room;
 S.cfg.fb=$('#fbcfg').value.trim();S.cfg.room=$('#fbroom').value.trim()||'saitama2026';S.cfg.hook=cleanHook($('#hook').value);S.cfg.hookAuto=$('#hookAuto').checked;
 if(old!==S.cfg.fb+'|'+S.cfg.room){if(SY.on)stopSync(true);SY.db=null;SY.last={}}
 persist(false);alert('保存しました');
}

  <textarea id="fbcfg" rows="5" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'>${e(c.fb)}</textarea>
  <div class="row">保存先コレクション名 <input type="text" id="fbroom" value="${e(c.room)}" style="width:180px"><span class="small">（2台で同じ名前にする）</span></div>
  <div class="row" style="margin-top:6px">${SY.on?'<button class="ng" onclick="stopSync()">自動同期を停止</button>':'<button class="pri" onclick="startSync()">自動同期を開始</button>'}
   <button onclick="pushAll()">全送信（この端末→クラウド）</button><button onclick="pullAll()">全受信（クラウド→この端末）</button></div>
  <div id="syncmsg" class="small">${e(SY.msg)}</div>
  <div class="small" style="margin-top:4px">はじめて使うとき：データを入れたPCで「全送信」→ もう1台で「全受信」→ 両方で「自動同期を開始」。</div></div>
 <div class="card"><h3>Discord 共有</h3>
  <div class="small">Webhook URL を設定すると、操作画面の「Discordに送信」で投影画面の画像（＋結果テキスト）を送れます。</div>
  <input type="text" id="hook" value="${e(c.hook)}" placeholder="https://discord.com/api/webhooks/..." oninput="S.cfg.hook=cleanHook(this.value);persist(false)">
  <label class="small" style="display:block;margin-top:6px"><input type="checkbox" id="hookAuto" ${c.hookAuto?'checked':''} onchange="S.cfg.hookAuto=this.checked;persist(false)"> 「順位を確定」したときに自動で送信する</label>
  <div class="row" style="margin-top:6px"><button onclick="testDiscord()">テスト送信（文字だけ）</button><button onclick="sendDiscord('【テスト】投影画面の画像送信')">テスト送信（画像つき）</button></div>
  <div class="small">Webhook URL は入力した時点で保存されます。</div>

/* ============================================================
 * 画像化・Discord共有
 * ============================================================ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function stageImage(){
 let host=$('#shotHost');
 if(!host){host=document.createElement('div');host.id='shotHost';host.className='cw';host.style.cssText='position:fixed;left:-20000px;top:0;width:1280px';host.innerHTML='<div class="stage" id="shotStage"></div>';document.body.appendChild(host)}
 delete PS['#shotStage'];drawStage('#shotStage');await sleep(120);
 const st=$('#shotStage');st.querySelectorAll('[data-h]').forEach(g=>g.style.height=g.dataset.h+'%');
 st.querySelectorAll('.qa,.rvov').forEach(q=>{q.innerHTML='';q.style.background='#000'}); // 問題・解答は送らない
 const W=1280,H=720;
 try{
  const css=[...document.styleSheets].map(x=>{try{return[...x.cssRules].map(r=>r.cssText).join('\n')}catch(_){return''}}).join('\n');
  const fix='*{animation:none!important;transition:none!important}.cb>.fk,.cb>.fl,.cb>.fr{display:none!important}.cb>.f{transform:none!important}';
  const html=`<div xmlns="http://www.w3.org/1999/xhtml" class="cw" style="width:${W}px"><style>${css.replace(/</g,'&lt;')}${fix}</style>${new XMLSerializer().serializeToString(st)}</div>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject width="100%" height="100%">${html}</foreignObject></svg>`;
  return await new Promise((ok,ng)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(im,0,0);try{ok(c.toDataURL('image/png'))}catch(x){ng(x)}};im.onerror=ng;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 }catch(x){
  if(typeof html2canvas==='undefined')throw x;
  const c=await html2canvas(st,{backgroundColor:'#000',onclone:d=>{const s=d.createElement('style');s.textContent='*{animation:none!important}.cb>.fk,.cb>.fl,.cb>.fr{display:none!important}.cb>.f{transform:none!important}';d.head.appendChild(s)}});
  return c.toDataURL('image/png');
 }
}
const fname=()=>'saitama_'+S.mode+'_'+(D().view==='game'?D().cur:D().view)+'_'+new Date().toTimeString().slice(0,8).replace(/:/g,'')+'.png';
async function saveImage(){try{const u=await stageImage();const a=document.createElement('a');a.href=u;a.download=fname();a.click()}catch(x){alert('画像化に失敗しました: '+x.message)}}
function resultText(dd,G){
 const R=RULE[G.type],ids=G.fixed?(dd.res[G.key]||rankIds(G)):rankIds(G);
 const head=`【${MODES[S.mode].jp}決定戦】${gLabel(G.key)}（${R.nm}）${G.fixed?'結果確定':'途中経過 Q.'+G.n}`;
 return head+'\n'+ids.map((id,i)=>{const p=G.st[id];return`${i<R.N&&G.fixed?'★':'　'}${ORD(i+1)} ${(pOf(dd,id)||{}).name||'?'}　${G.type==='q1'?'LP'+p.lp:p.pt+'pt'} ○${p.c}×${p.x}`}).join('\n');
}
const cleanHook=v=>String(v||'').replace(/[\s　]/g,'');
const HOOK_RE=/^https:\/\/(?:ptb\.|canary\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+/;
function hookCheck(){
 const h=S.cfg.hook;
 if(!h){alert('ホスト画面の「Discord 共有」に Webhook URL を入力してください');return false}
 if(!HOOK_RE.test(h)){alert('Webhook URL の形式が正しくありません。\nDiscordのチャンネル設定 →「連携サービス」→「ウェブフック」→「ウェブフックURLをコピー」で取得したURLを、そのまま貼り付けてください。\n\n現在の値：'+h.slice(0,60)+(h.length>60?'…':''));return false}
 return true;
}
async function postHook(f){
 let r;
 try{r=await fetch(S.cfg.hook,{method:'POST',body:f})}
 catch(x){
  // ブラウザの制限（CORS）で応答が読めない場合。送信自体は行われていることが多い
  return{ok:null,msg:'送信しました（ブラウザの制限でDiscordからの応答は確認できません。チャンネルに届いているか確認してください）'};
 }
 if(r.ok)return{ok:true,msg:'Discordに送信しました'};
 const why={400:'送信内容が受け付けられませんでした',401:'Webhook URL が無効です',403:'Webhook に送信する権限がありません',404:'Webhook が見つかりません（削除・再作成された可能性があります。URLをコピーし直してください）',413:'画像が大きすぎます',429:'送信が多すぎます。少し待ってから再送してください'}[r.status]||'';
 return{ok:false,msg:'Discord送信に失敗しました（HTTP '+r.status+'）'+(why?'\n'+why:'')};
}
function sendCur(){const dd=D(),G=dd.view==='game'?dd.games[dd.cur]:null;sendDiscord(G?resultText(dd,G):'')}
async function testDiscord(){
 if(!hookCheck())return;
 const f=new FormData();f.append('content','【テスト】埼玉クイズ 得点表示アプリからの送信テストです '+new Date().toLocaleString());
 const res=await postHook(f);res.ok===false?alert(res.msg):toast(res.msg);
}
async function sendDiscord(text){
 if(!hookCheck())return;
 const body=(text||`【${MODES[S.mode].jp}決定戦】投影画面`).slice(0,1900)+'\n'+new Date().toLocaleString();
 const f=new FormData();let imgErr='';
 try{const u=await stageImage(),b=await (await fetch(u)).blob();f.append('file',b,fname())}
 catch(x){imgErr=x&&x.message||String(x)}
 f.append('content',imgErr?body+'\n（画像の作成に失敗したため文字のみ）':body);
 const res=await postHook(f);
 if(res.ok===false)return alert(res.msg);
 toast(res.msg+(imgErr?'（画像なし：'+imgErr+'）':''));
}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;right:16px;bottom:16px;max-width:520px;background:#1b6b2c;color:#fff;padding:10px 16px;border-radius:6px;z-index:200;font-weight:700;line-height:1.5';document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}

/* ============================================================
 * 起動
 * ============================================================ */
let lastRev=-1;
function recv(s,q){if(!s||!s.T||s.rev<=lastRev)return;lastRev=s.rev;S=s;if(q)QS=q;drawStage('#projStage')}
addEventListener('message',ev=>{const d=ev.data||{};if(IS_PROJ&&d.s)recv(d.s,d.qs);if(!IS_PROJ&&d.hello&&proj&&!proj.closed)proj.postMessage({s:S,qs:QS},'*')});
if(bc)bc.onmessage=ev=>{if(IS_PROJ&&ev.data)recv(ev.data.s,ev.data.qs)};
addEventListener('storage',ev=>{if(IS_PROJ&&ev.key===LSK)try{recv(JSON.parse(ev.newValue))}catch(x){}});
function showTab(t){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
 ['host','op','rc','mc'].forEach(k=>{const p=$('#p-'+k);if(p)p.style.display=k===t?'':'none'});document.body.classList.toggle('mcmode',t==='mc');refreshUI();if(t==='op')setTimeout(syncOpH,30)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
setTheme(S.mode);
if(IS_PROJ){document.body.classList.add('proj');lastRev=S.rev;drawStage('#projStage');if(opener)opener.postMessage({hello:1},'*');addEventListener('resize',()=>fit($('#projStage')))}
else{applyDev();showTab(DEV.role==='rc'?'rc':DEV.role==='mc'?'mc':DEV.role==='op'?'op':'host');if(S.cfg.auto&&S.cfg.fb)startSync();if(!DEV.name)openDev()}
if(document.fonts)document.fonts.ready.then(()=>['#pv','#projStage','#opL'].forEach(q=>{const el=$(q);if(el)fit(el)}));
</script>
